<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="מעקב הכנסות והוצאות" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="מעקב כסף" />
    <title>מעקב כסף</title>
    <script>
      // Apply the saved theme and language before the first paint, so there's no flash.
      // Must match src/lib/storage.ts (key) and src/hooks/useTheme.ts (dark rule).
      try {
        var settings = (JSON.parse(localStorage.getItem('money-tracker:v2')) || {}).settings || {}
        var dark =
          settings.theme === 'dark' ||
          (settings.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (settings.language === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
      } catch (e) {
        // Broken or blocked storage: keep the defaults.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
